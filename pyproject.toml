[project]
name = "uk-bank-mcp-monzo"
dynamic = ["version"]
description = "Unofficial read-only MCP server for the Monzo personal developer API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "pritch56" }]
keywords = ["mcp", "model-context-protocol", "monzo", "banking", "read-only", "personal-finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "pydantic>=2.7",
    "uvicorn>=0.30",
    "tzdata>=2024.1",
]

[project.urls]
Homepage = "https://github.com/pritch56/Monzo-MCP"
Repository = "https://github.com/pritch56/Monzo-MCP"
Issues = "https://github.com/pritch56/Monzo-MCP/issues"
Changelog = "https://github.com/pritch56/Monzo-MCP/blob/main/CHANGELOG.md"

[project.scripts]
monzo-mcp = "monzo_mcp.server:main"
monzo-mcp-authorize = "monzo_mcp.authorize:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "starlette>=0.37",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/monzo_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/monzo_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S110", "ASYNC"]
ignore = ["UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC"]
